<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="100%" stop-color="#a0522d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#a0522d"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="450" cy="391" r="42" fill="#a0522d" opacity="0.06"/>
    <circle cx="-87" cy="-30" r="37" fill="#a0522d" opacity="0.08"/>
    <circle cx="84" cy="455" r="54" fill="#a0522d" opacity="0.06"/>
    <circle cx="-14" cy="367" r="79" fill="#a0522d" opacity="0.09"/>
    <circle cx="181" cy="401" r="59" fill="#a0522d" opacity="0.10"/>
    <circle cx="152" cy="-69" r="48" fill="#a0522d" opacity="0.11"/>
    <rect x="365" y="501" width="20" height="66" rx="8" fill="#8b4513" opacity="0.12" transform="rotate(19, -75, 29)"/>
    <rect x="1259" y="267" width="64" height="60" rx="8" fill="#8b4513" opacity="0.10" transform="rotate(14, 279, 396)"/>
    <rect x="490" y="-73" width="72" height="53" rx="8" fill="#8b4513" opacity="0.10" transform="rotate(12, 168, 423)"/>
    <rect x="-15" y="38" width="58" height="38" rx="8" fill="#8b4513" opacity="0.05" transform="rotate(10, 636, 107)"/>
    <rect x="391" y="32" width="92" height="88" rx="8" fill="#8b4513" opacity="0.04" transform="rotate(1, 426, 429)"/>
    <rect x="765" y="688" width="36" height="71" rx="8" fill="#8b4513" opacity="0.06" transform="rotate(19, -77, 576)"/>
    <rect x="92" y="426" width="89" height="98" rx="8" fill="#8b4513" opacity="0.08" transform="rotate(8, 625, 0)"/>
    <rect x="225" y="201" width="90" height="61" rx="8" fill="#8b4513" opacity="0.08" transform="rotate(3, 892, 64)"/>
    <polygon points="56,63 136,223 -24,223" fill="#a0522d" opacity="0.13"/>
    <polygon points="320,392 379,510 261,510" fill="#a0522d" opacity="0.13"/>
    <polygon points="136,-52 175,26 97,26" fill="#a0522d" opacity="0.05"/>
    <polygon points="570,317 665,507 475,507" fill="#a0522d" opacity="0.09"/>

  <!-- Wave at bottom -->
  <path d="M0,570 C360,600 840,540 1200,570 L1200,630 L0,630Z" fill="#a0522d" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    염창 룸싸롱 TOP5
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    염창 — 룸싸롱
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#daa520" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#daa520" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    염창 염창 룸싸롱 TOP5 — 룸싸롱
  </text>
</svg>